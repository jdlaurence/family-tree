# ─────────────────────────────────────────────────────────────────────────────
#  THE FAMILY FILE
#
#  This one file is the whole family archive. Edit it here on GitHub (pencil
#  icon → commit) and the site updates within a minute or two.
#
#  Each person is a block under "people:". Only "id" and "name" are required.
#  See README.md for the full list of fields and examples.
#
#  Quick reference
#    id          short, stable, lowercase slug (never change it once set)
#    name        full name as they'd introduce themselves
#    birth_name  maiden / birth surname, shown as "née …"
#    nickname    what the family calls them; also used as the short name on the tree
#    short_name  override the name printed on the tree (default: first + last word)
#    born/died   1965  |  1965-03  |  1965-03-12  |  c. 1932  (leave off if unknown)
#    deceased    true  — if they have died but you don't know the date
#    born_place / died_place
#    photo       filename in the photos/ folder (square-ish JPEG, ~400px works well)
#    parents     list of ids (one or two)
#    spouses     list of { id, married, divorced, widowed }
#    tagline     one line shown on hover
#    bio         Markdown paragraphs
#    facts       list of short fun facts
#    stories     list of { title, told_by, date, text }
# ─────────────────────────────────────────────────────────────────────────────

