name: Check family.yaml

on:
  push:
    paths: ["family.yaml", "photos/**", "src/**", "scripts/**", "vendor/**"]
  pull_request:
    paths: ["family.yaml", "photos/**", "src/**", "scripts/**", "vendor/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the family file
        run: node scripts/validate.mjs
