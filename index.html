<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Family Tree</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f6f0e4' stroke='%239b6a3c' stroke-width='2'/%3E%3Ccircle cx='16' cy='11' r='3' fill='%239b6a3c'/%3E%3Ccircle cx='10' cy='21' r='3' fill='%239b6a3c'/%3E%3Ccircle cx='22' cy='21' r='3' fill='%239b6a3c'/%3E%3Cpath d='M16 14v3M16 17h-6v1M16 17h6v1' stroke='%239b6a3c' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Password screen -->
  <div id="gate" class="gate" hidden>
    <form class="gate-card" autocomplete="off">
      <p class="eyebrow">A family archive</p>
      <h1 id="gate-title" class="gate-title">Family Tree</h1>
      <div class="ornament" aria-hidden="true">❦</div>
      <label class="gate-label" for="gate-password">Password</label>
      <div class="gate-row">
        <input id="gate-password" type="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="btn btn-primary">Enter</button>
      </div>
      <p class="gate-error" hidden>That isn’t it. Try again.</p>
    </form>
  </div>

  <!-- Data problem screen -->
  <div id="error" class="error" hidden>
    <div class="error-card">
      <p class="eyebrow">Something needs fixing in family.yaml</p>
      <ul></ul>
      <p class="error-help">Fix the lines above and reload. The <code>README</code> shows every field and an example.</p>
    </div>
  </div>

  <!-- The app -->
  <div id="app" class="app" hidden>
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <h1 id="site-title" class="site-title">Family Tree</h1>
        <span id="count" class="count"></span>
      </div>
      <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Find someone…" aria-label="Find a person" autocomplete="off" spellcheck="false">
        <kbd class="search-kbd">⌘K</kbd>
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
    </header>

    <svg id="tree" class="tree" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Family tree">
      <g id="viewport"></g>
    </svg>

    <div id="tooltip" class="tooltip" hidden role="tooltip">
      <div class="tip-name"></div>
      <div class="tip-dates"></div>
      <div class="tip-tagline"></div>
    </div>

    <div class="toolbar" role="group" aria-label="Zoom">
      <button id="zoom-in" class="tool" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoom-out" class="tool" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoom-fit" class="tool" title="Fit the whole tree" aria-label="Fit the whole tree">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <p id="hint" class="hint" hidden>Drag to look around · scroll or pinch to zoom · click anyone to read about them</p>

    <aside id="panel" class="panel" hidden aria-label="Person details">
      <button class="panel-close" aria-label="Close">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <div class="panel-grip" aria-hidden="true"></div>
      <div class="panel-scroll"></div>
    </aside>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
